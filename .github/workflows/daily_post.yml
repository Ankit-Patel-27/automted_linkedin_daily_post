name: Daily LinkedIn Post

on:
  schedule:
    # Runs every weekday at 9:00 AM IST (3:30 AM UTC)
    - cron: "30 3 * * 1-5"
  workflow_dispatch:   # Allows manual trigger from GitHub Actions tab

# Grant write permission to push topic tracker back to repo
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: sudo apt-get install -y libcairo2 libcairo2-dev pkg-config python3-dev && pip install groq requests cairosvg

      - name: Generate post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python post_generator.py

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python linkedin_poster.py

      - name: Commit updated topic tracker and history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json post_history.json || true
          git diff --staged --quiet || git commit -m "chore: update post log $(date +'%Y-%m-%d')"
          git push