name: Weekly Analytics Report

on:
  schedule:
    - cron: "0 4 * * 1"   # Every Monday 9:30 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch analytics
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN:   ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python analytics.py
        continue-on-error: true

      - name: Write weekly report markdown
        run: python notify.py success
        continue-on-error: true

      - name: Commit weekly report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics_report.json WEEKLY_REPORT.md || true
          git diff --staged --quiet || git commit -m "chore: weekly report $(date +'%Y-%m-%d')"
          git push
