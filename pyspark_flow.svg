<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#E91E8C"/>
    </marker>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFC107"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#E91E8C" font-size="18" font-weight="700" filter="url(#glow)">PySpark Data Processing Pipeline</text>
  <text x="400" y="56" text-anchor="middle" fill="#8892a4" font-size="11">SparkSession · Transformations · Optimisations · Joins · Output</text>
  <line x1="60" y1="66" x2="740" y2="66" stroke="#1e2538" stroke-width="1"/>

  <!-- ── STAGE 1: SparkSession / Config ── -->
  <rect x="40" y="85" width="720" height="62" rx="8" fill="#1a0010" stroke="#E91E8C" stroke-width="1.5"/>
  <text x="60" y="108" fill="#E91E8C" font-size="11" font-weight="700">① SparkSession + Config</text>
  <text x="60" y="126" fill="#c2185b" font-size="10">spark = SparkSession.builder.appName("pipeline").config("spark.sql.shuffle.partitions","200").getOrCreate()</text>
  <text x="60" y="141" fill="#880e4f" font-size="9">spark.conf.set("spark.sql.adaptive.enabled","true")  ·  spark.conf.set("spark.sql.autoBroadcastJoinThreshold","10mb")</text>

  <line x1="400" y1="147" x2="400" y2="165" stroke="#E91E8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── STAGE 2: Read ── -->
  <text x="60" y="180" fill="#8892a4" font-size="9" font-weight="600" letter-spacing="2">② READ</text>
  <rect x="40" y="186" width="155" height="52" rx="6" fill="#100010" stroke="#AB47BC" stroke-width="1.3"/>
  <text x="118" y="205" text-anchor="middle" fill="#AB47BC" font-size="10" font-weight="600">S3 / Delta Lake</text>
  <text x="118" y="220" text-anchor="middle" fill="#7b1fa2" font-size="9">spark.read.format("delta")</text>
  <text x="118" y="232" text-anchor="middle" fill="#7b1fa2" font-size="9">.load(path)</text>

  <rect x="210" y="186" width="155" height="52" rx="6" fill="#100010" stroke="#AB47BC" stroke-width="1.3"/>
  <text x="287" y="205" text-anchor="middle" fill="#AB47BC" font-size="10" font-weight="600">JDBC / RDS</text>
  <text x="287" y="220" text-anchor="middle" fill="#7b1fa2" font-size="9">spark.read.format("jdbc")</text>
  <text x="287" y="232" text-anchor="middle" fill="#7b1fa2" font-size="9">.option("dbtable",…)</text>

  <rect x="380" y="186" width="155" height="52" rx="6" fill="#100010" stroke="#AB47BC" stroke-width="1.3"/>
  <text x="457" y="205" text-anchor="middle" fill="#AB47BC" font-size="10" font-weight="600">Streaming (Kafka)</text>
  <text x="457" y="220" text-anchor="middle" fill="#7b1fa2" font-size="9">spark.readStream</text>
  <text x="457" y="232" text-anchor="middle" fill="#7b1fa2" font-size="9">.format("kafka")</text>

  <rect x="550" y="186" width="210" height="52" rx="6" fill="#100010" stroke="#AB47BC" stroke-width="1.3"/>
  <text x="655" y="205" text-anchor="middle" fill="#AB47BC" font-size="10" font-weight="600">Partition Pruning</text>
  <text x="655" y="220" text-anchor="middle" fill="#7b1fa2" font-size="9">filter on partition col first</text>
  <text x="655" y="232" text-anchor="middle" fill="#7b1fa2" font-size="9">avoids full scan</text>

  <!-- Arrows Read → Transform -->
  <line x1="118" y1="238" x2="118" y2="265" stroke="#E91E8C" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="287" y1="238" x2="287" y2="265" stroke="#E91E8C" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="457" y1="238" x2="400" y2="265" stroke="#E91E8C" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── STAGE 3: Transformations ── -->
  <text x="60" y="278" fill="#8892a4" font-size="9" font-weight="600" letter-spacing="2">③ TRANSFORM</text>
  <rect x="40" y="284" width="340" height="72" rx="6" fill="#0a1520" stroke="#4fc3f7" stroke-width="1.3"/>
  <text x="210" y="302" text-anchor="middle" fill="#4fc3f7" font-size="10" font-weight="600">Core Transformations</text>
  <text x="60" y="318" fill="#0288d1" font-size="9">df.select()  ·  .filter()  ·  .withColumn()  ·  .drop()</text>
  <text x="60" y="332" fill="#0288d1" font-size="9">df.groupBy("col").agg(sum(), avg(), count())</text>
  <text x="60" y="346" fill="#0288d1" font-size="9">Window: rank().over(Window.partitionBy("x").orderBy("y"))</text>

  <!-- Broadcast join box -->
  <rect x="395" y="284" width="365" height="72" rx="6" fill="#0a1a0a" stroke="#00C853" stroke-width="1.3"/>
  <text x="577" y="302" text-anchor="middle" fill="#00C853" font-size="10" font-weight="600">Join Optimisations</text>
  <text x="410" y="318" fill="#00897b" font-size="9">Broadcast join (small table &lt;10MB):  broadcast(dim_df)</text>
  <text x="410" y="332" fill="#00897b" font-size="9">Salting for skewed keys:  df.withColumn("salt", rand()*10)</text>
  <text x="410" y="346" fill="#00897b" font-size="9">AQE auto-join reorder:  spark.sql.adaptive.enabled=true</text>

  <!-- Arrows Transform → Optimise -->
  <line x1="210" y1="356" x2="210" y2="383" stroke="#FFC107" stroke-width="1.5" marker-end="url(#arrY)"/>
  <line x1="577" y1="356" x2="577" y2="383" stroke="#FFC107" stroke-width="1.5" marker-end="url(#arrY)"/>

  <!-- ── STAGE 4: Optimise / Cache ── -->
  <text x="60" y="396" fill="#8892a4" font-size="9" font-weight="600" letter-spacing="2">④ OPTIMISE</text>
  <rect x="40" y="402" width="210" height="44" rx="6" fill="#1a1400" stroke="#FFC107" stroke-width="1.3"/>
  <text x="145" y="420" text-anchor="middle" fill="#FFC107" font-size="10" font-weight="600">Cache / Persist</text>
  <text x="145" y="435" text-anchor="middle" fill="#a08000" font-size="9">df.cache()  ·  .persist(MEMORY_AND_DISK)</text>

  <rect x="265" y="402" width="210" height="44" rx="6" fill="#1a1400" stroke="#FFC107" stroke-width="1.3"/>
  <text x="370" y="420" text-anchor="middle" fill="#FFC107" font-size="10" font-weight="600">Repartition</text>
  <text x="370" y="435" text-anchor="middle" fill="#a08000" font-size="9">df.repartition(200, "key")  ·  coalesce()</text>

  <rect x="490" y="402" width="270" height="44" rx="6" fill="#1a1400" stroke="#FFC107" stroke-width="1.3"/>
  <text x="625" y="420" text-anchor="middle" fill="#FFC107" font-size="10" font-weight="600">Explain Plan</text>
  <text x="625" y="435" text-anchor="middle" fill="#a08000" font-size="9">df.explain(mode="cost")  ·  avoid cartesian joins</text>

  <!-- Arrows Optimise → Write -->
  <line x1="400" y1="446" x2="400" y2="462" stroke="#E91E8C" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── STAGE 5: Write ── -->
  <rect x="40" y="462" width="720" height="28" rx="6" fill="#1a0010" stroke="#E91E8C" stroke-width="1.3"/>
  <text x="400" y="476" text-anchor="middle" fill="#E91E8C" font-size="10" font-weight="600">⑤ WRITE  ·  df.write.format("delta").mode("overwrite").partitionBy("date").save(output_path)</text>

  <text x="750" y="496" text-anchor="end" fill="#3a4258" font-size="9">#PySpark #ApacheSpark</text>
</svg>
