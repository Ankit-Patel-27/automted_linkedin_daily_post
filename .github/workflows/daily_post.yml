name: Daily LinkedIn Post

on:
  schedule:
    - cron: "0 1 * * *"   # 6:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # fetch full history so git pull/merge works
          persist-credentials: true # use GITHUB_TOKEN for pushes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          # Try install up to 3 times to tolerate transient mirror/network issues
          PACKAGES="libcairo2 libcairo2-dev pkg-config python3-dev"
          for i in 1 2 3; do
            sudo apt-get install -y --no-install-recommends $PACKAGES && break || {
              echo "apt install failed, attempt $i" >&2
              sudo apt-get -y -f install || true
              sudo apt-get update -y
              sleep $((i * 2))
            }
          done
          # If there are still missing packages, attempt a fix-missing install
          sudo apt-get install -y --fix-missing $PACKAGES || true
          pip install --upgrade pip
          pip install groq requests matplotlib Pillow

      - name: Generate post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPAPI_KEY:  ${{ secrets.SERPAPI_KEY }}
        run: python post_generator.py

      - name: Publish to LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN:   ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python linkedin_poster.py

      - name: Fetch analytics
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN:   ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python analytics.py
        continue-on-error: true

      - name: Success — clear failure report, check token, write weekly report
        run: python notify.py success
        continue-on-error: true

      - name: Commit all logs to repo
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json post_history.json analytics_report.json \
                  token_meta.json WEEKLY_REPORT.md || true
          git rm --cached FAILURE_REPORT.md 2>/dev/null || true
          git add -A
          git diff --staged --quiet || git commit -m "chore: update logs $(date +'%Y-%m-%d')"
          # Merge remote changes first to avoid push rejection
          git fetch origin "$BRANCH" --depth=1 || true
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"

      # ── Only runs if any previous step failed ──────────────────────────────
      - name: Write failure report to repo
        if: failure()
        run: python notify.py failure "One or more steps failed — check Actions logs"
        continue-on-error: true

      - name: Commit failure report
        if: failure()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FAILURE_REPORT.md token_meta.json expiry_warning.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: failure report $(date +'%Y-%m-%d')"
          # Merge remote changes first to avoid push rejection
          git fetch origin "$BRANCH" --depth=1 || true
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
        continue-on-error: true
